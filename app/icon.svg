<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <!-- Chain link left circle -->
  <circle cx="11" cy="16" r="5" stroke="url(#spark)" stroke-width="2.2" fill="none"/>
  <!-- Chain link right circle -->
  <circle cx="21" cy="16" r="5" stroke="url(#spark)" stroke-width="2.2" fill="none"/>
  <!-- Connecting bar top -->
  <rect x="13.5" y="12.5" width="5" height="2" rx="1" fill="url(#bg)"/>
  <!-- Connecting bar bottom -->
  <rect x="13.5" y="17.5" width="5" height="2" rx="1" fill="url(#bg)"/>
  <!-- Spark/forge dot center -->
  <circle cx="16" cy="16" r="1.5" fill="#e0e7ff"/>
</svg>
